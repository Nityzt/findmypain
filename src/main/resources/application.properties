spring.application.name=FindMyPainfinal
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
spring.ai.model.chat=none
spring.ai.model.embedding.text=none
spring.ai.model.audio.speech=none
server.port=8080

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
vapi.api-key=${VAPI_API_KEY:}
vapi.assistant-id=${VAPI_ASSISTANT_ID:}
